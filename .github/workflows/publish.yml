name: Publish scramjet-wisp → vssh-repo

# Publica o vssh-app "scramjet-wisp" (motor de navegação) no repositório de artefatos do vssh
# (Worker D1/R2) a cada push em main. Depois de publicado, fica instalável no servidor via
# `sudo vssh-app-install scramjet-wisp --force` (baixa o tarball do Worker).
#
# POR QUE ISTO MUDOU (não desfaça sem ler):
#   A versão anterior inlineava os passos e dava checkout de `colabhd/vssh-sso` (sparse `scripts/`)
#   com um PAT, para rodar `_tools/scripts/vssh-app-publish`. Esse script FOI MOVIDO para o
#   colabhd/vssh-app-toolkit no commit 1acc1ef — desde então todo push em main falhava com "No such
#   file or directory", e o app ficou sem poder publicar.
#   O racional original ("vssh-sso é privado e de outra conta, `uses:` cross-owner não funciona")
#   morreu junto: o toolkit é PÚBLICO, então o `uses:` abaixo resolve no github.token deste repo,
#   sem PAT nenhum. O antigo secret VSSH_TOOLS_TOKEN não é mais referenciado e deve ser apagado
#   AQUI e revogado no GitHub (apagar o secret não revoga o credential).
#
# POR QUE `v4` NAS DUAS REFS (`uses:@v4` e `tools_ref: v4`):
#   Este bloco dizia `main`, e a razão dele era real na época: a única tag existente era a `v1`,
#   congelada num commit ANTERIOR a `schema/`, então `@v1` degradava em silêncio para as checagens
#   mínimas (id/runtime/entrypoint) e só `main` validava o manifesto inteiro. Hoje existe a `v4`,
#   que tem schema, package.json e o portão de versão das libs.
#   **E `main` cobra um preço que a `v1` não cobrava:** puxar de um branch faz a validação do CI
#   deste repo mudar debaixo dele a cada commit do toolkit, inclusive num push que ninguém aqui
#   viu. Uma tag se move quando nós decidimos.
#
# O publish só roda depois do smoke passar. Publicar um tarball cujo `npm ci` não resolve, ou que
# não serve os assets que o ScramjetEngine.js pede, apenas desloca a falha para o servidor do
# usuário — que foi exatamente como o último incidente apareceu (502, sem log).
#
# Secret necessário (Settings → Secrets and variables → Actions):
#   - VSSH_REPO_PUBLISH_TOKEN: token de publicação do Worker, escopado `app:scramjet-wisp`.
# Variable opcional (não secret):
#   - VSSH_REPO_API (default abaixo): base URL do Worker do repositório.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke
    uses: ./.github/workflows/smoke.yml

  publish:
    name: Publish scramjet-wisp → repo
    needs: smoke
    uses: colabhd/vssh-app-toolkit/.github/workflows/_publish-app-reusable.yml@v5
    with:
      app_dir: "."
      repo_api: ${{ vars.VSSH_REPO_API || 'https://vssh-repo.colabh.org' }}
      # `4.0.<run>` e não `1.0.<run>`: o manifesto declara 4.0.0 para dizer que este app é da
      # geração socket-only, e publicar como 1.x fazia o número que chega ao servidor contradizer o
      # que está escrito no pacote. O sufixo continua sendo o run_number, que é o que dá ordem.
      version: "4.0.${{ github.run_number }}"
      tools_ref: v4
    secrets:
      publish_token: ${{ secrets.VSSH_REPO_PUBLISH_TOKEN }}
