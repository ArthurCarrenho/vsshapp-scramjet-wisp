name: Upstream

# Avisa quando o upstream de alguma subárvore de `engines/` andar, e quando uma dependência que vive
# fora de `engines/` tiver versão nova: o npm do backend e as bibliotecas C do libcurl.js (o mbedtls
# e o curl, fixados em `engines/libcurl.js/client/tools/*.sh`).
#
# Trazer o código continua manual: sincronizar um fork com dezenas de commits nossos por cima é
# decisão de uma pessoa. Este workflow garante que ela seja avisada. Sem ele, alguém descobriria
# que o upstream mexeu meses depois, por acaso, ao abrir o repositório dele por outro motivo.
#
# Como ele sabe o que comparar: `engines/UPSTREAM.json` diz, para cada subárvore, qual é o fork, qual
# é o upstream, qual é o branch DELE e em que commit do nosso fork a cópia foi feita. O ponto
# correspondente no upstream é o merge-base, e quem o calcula é a própria API do GitHub — o
# endpoint `compare` de um fork enxerga os commits do parent, então nada precisa ser clonado.
#
# ⚠ O branch do upstream NÃO é sempre `main`: o `libcurl-transport` usa `master`. Assumir `main`
# faria a comparação falhar para ele — e falhar de um jeito que se parece com "nada mudou".
#
# ⚠⚠ **O campo é `ahead_by`, e NÃO `behind_by`.** Em `compare/<base>...<head>` os dois se leem do
# ponto de vista do HEAD, que aqui é o upstream:
#
#     ahead_by  = commits que o UPSTREAM tem e nós não   ← é isto que se vigia
#     behind_by = commits NOSSOS que eles não têm        ← é a nossa divergência, e ela é o normal
#
# A primeira versão deste arquivo vigiava `behind_by`, e teria aberto issue toda semana dizendo "o
# upstream andou" sem ninguém ter andado: no dia em que foi escrito, `behind_by` valia 33, 7 e 6 —
# que são exatamente os NOSSOS commits em cada fork. O sinal de que a leitura estava invertida
# estava na mesma resposta e passou batido: `merge_base` era igual ao HEAD do upstream, e a lista
# `.commits` vinha VAZIA. Quando a contagem não bate com nada, olhe a lista.
#
# O compare mede a partir do merge-base do FORK, e um commit do upstream trazido aqui por
# `git am --directory` não o move: a contagem seguiria dizendo que ele falta. Por isso o
# `UPSTREAM.json` lista em `trazidos` (e `recusados`) o que já foi decidido, e os commits do compare
# passam por esse filtro, pelo SHA ou pelo `(#N)` que o squash de um PR põe no título. O enxerto
# também tem duas metades: os commits do fork e os feitos neste repositório em `engines/<sub>` desde
# o import, que é o primeiro commit a tocar a subárvore.
#
# Uma issue só, atualizada, e nunca uma por execução: um alarme que abre issue toda semana vira
# ruído e passa a ser fechado sem ler, que é o oposto do que ele existe para fazer.

on:
  schedule:
    # Segunda de manhã. O mesmo horário do antigo cron do smoke, que morreu quando as dependências
    # deixaram de vir de release — o intervalo semanal continua certo para "o upstream mexeu?", que
    # é uma pergunta cuja resposta não fica velha em horas.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  olhar:
    name: O upstream andou?
    runs-on: ubuntu-latest
    steps:
      # O histórico inteiro: os commits nossos em `engines/` se contam desde o import.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Comparar cada subárvore com o upstream dela
        id: comparar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          linhas=""
          atrasados=0

          # `to_entries` pulando as chaves que começam com `_`: o `_comentario` do JSON é para quem
          # lê o arquivo, e tratá-lo como subárvore renderia um erro obscuro em vez de ser ignorado.
          while IFS=$'\t' read -r caminho fork upstream branch sinc; do
            [ -n "$caminho" ] || continue
            dono="${upstream%%/*}"

            # `compare/<nosso-sha>...<dono>:<branch>` — três pontos, que compara pelo merge-base.
            # `|| true` para que um upstream renomeado ou removido vire uma LINHA no relatório em
            # vez de derrubar o job inteiro e levar junto o aviso das outras duas subárvores.
            resp=$(gh api "repos/$fork/compare/$sinc...$dono:$branch" 2>/dev/null || echo '')
            if [ -z "$resp" ]; then
              linhas="${linhas}| \`$caminho\` | $upstream | **não deu para comparar** | — | — |"$'\n'
              atrasados=$((atrasados + 1))
              continue
            fi

            # `deles` é o que se vigia, sem o que já veio ou foi recusado. `nossos` entra no relatório
            # porque mede o enxerto que a sincronização vai reaplicar, e quem lê a issue decide por
            # ele se o trabalho é de uma tarde ou de uma semana.
            decididos=$(jq -c --arg c "$caminho" '[.[$c].trazidos[]?, .[$c].recusados[]?]' engines/UPSTREAM.json)
            deles=$(printf '%s' "$resp" | jq --argjson k "$decididos" '
              [.commits[] | . as $x
               | select($k | any(
                   (.commit as $sha | $sha != null and ($x.sha | startswith($sha)))
                   or (.pr as $pr | $pr != null and ($x.commit.message | split("\n")[0] | contains("(#\($pr))")))
                 ) | not)]
              | length')
            importe=$(git log --format=%H --reverse -- "$caminho" | head -1)
            aqui=$(git rev-list --count "$importe..HEAD" -- "$caminho")
            nossos=$(( $(printf '%s' "$resp" | jq -r '.behind_by') + aqui ))
            base=$(printf '%s' "$resp" | jq -r '.merge_base_commit.sha[0:7]')
            if [ "$deles" -gt 0 ]; then
              linhas="${linhas}| \`$caminho\` | [$upstream](https://github.com/$upstream/compare/$base...$branch) | **$deles** | $nossos | \`$base\` |"$'\n'
              atrasados=$((atrasados + 1))
            else
              echo "em dia: $caminho (upstream parado em $base; $nossos commits nossos por cima)"
            fi
          done < <(jq -r 'to_entries[] | select(.key | startswith("_") | not) | [.key, .value.fork, .value.upstream, .value.branch, .value.sincronizado] | @tsv' engines/UPSTREAM.json)

          {
            echo "atrasados=$atrasados"
            echo "tabela<<FIM"
            printf '%s' "$linhas"
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      # O npm sem `node_modules` lê o lockfile, e é o que basta para dizer o que o semver do
      # `package.json` não alcança (`wanted` diferente de `latest`). O mbedtls se compara dentro da
      # linha fixada (3.6.x), que é a de suporte longo e a que traz as correções de CVE; o curl, com o
      # release mais novo.
      - name: As dependências fora de engines/
        id: deps
        run: |
          set -euo pipefail
          linhas=""
          novas=0

          npm_json=$(cd backend && npm outdated --json 2>/dev/null || true)
          while IFS=$'\t' read -r nome quer ultima; do
            [ -n "$nome" ] || continue
            linhas="${linhas}| npm \`$nome\` | $quer | **$ultima** |"$'\n'
            novas=$((novas + 1))
          done < <(printf '%s' "${npm_json:-{\}}" | jq -r 'to_entries[] | select(.value.wanted != .value.latest) | [.key, .value.wanted, .value.latest] | @tsv')

          mbed=$(grep -oE 'mbedtls-[0-9]+\.[0-9]+\.[0-9]+' engines/libcurl.js/client/tools/mbedtls.sh | head -1 | sed 's/^mbedtls-//')
          mbed_ultima=$(git ls-remote --tags --refs https://github.com/Mbed-TLS/mbedtls "refs/tags/mbedtls-${mbed%.*}.*" \
            | sed 's#.*refs/tags/mbedtls-##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "$mbed_ultima" ] && [ "$mbed_ultima" != "$mbed" ]; then
            linhas="${linhas}| mbedtls | $mbed | **$mbed_ultima** |"$'\n'
            novas=$((novas + 1))
          fi

          curl_pin=$(grep -oE '^CURL_VERSION="[^"]+"' engines/libcurl.js/client/tools/curl.sh | cut -d'"' -f2)
          curl_ultima=$(git ls-remote --tags --refs https://github.com/curl/curl 'refs/tags/curl-*' \
            | sed 's#.*refs/tags/curl-##' | grep -E '^[0-9]+_[0-9]+_[0-9]+$' | tr _ . | sort -V | tail -1)
          if [ -n "$curl_ultima" ] && [ "$curl_ultima" != "$curl_pin" ]; then
            linhas="${linhas}| curl | $curl_pin | **$curl_ultima** |"$'\n'
            novas=$((novas + 1))
          fi

          echo "dependências: npm $(printf '%s' "${npm_json:-{\}}" | jq 'length') desatualizadas, mbedtls $mbed (última ${mbed_ultima:-?}), curl $curl_pin (última ${curl_ultima:-?})"
          {
            echo "novas=$novas"
            echo "tabela<<FIM"
            printf '%s' "$linhas"
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      # Sem nada atrasado não se toca em issue nenhuma — nem para fechar. Fechar sozinho uma issue
      # que alguém está usando para anotar o plano de sincronização seria pior que deixá-la aberta.
      - name: Abrir ou atualizar a issue
        if: steps.comparar.outputs.atrasados != '0' || steps.deps.outputs.novas != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TABELA: ${{ steps.comparar.outputs.tabela }}
          DEPS: ${{ steps.deps.outputs.tabela }}
        run: |
          set -euo pipefail
          TITULO="Upstream andou desde a última sincronização"

          corpo=$(cat <<CORPO
          O upstream das subárvores abaixo ganhou commits que \`engines/\` não tem. Isto é um aviso,
          não uma tarefa: sincronizar um fork com dezenas de commits nossos por cima é decisão, e o
          valor disto é a decisão ser tomada sabendo, e não descoberta por acaso.

          | subárvore | upstream | commits deles | commits nossos | desde |
          |---|---|---|---|---|
          ${TABELA}

          "commits deles" é o que falta trazer, fora o que \`engines/UPSTREAM.json\` já registra
          como trazido ou recusado. "commits nossos" é o enxerto que a sincronização vai ter que
          reaplicar por cima (os do fork e os deste repositório em \`engines/\`): é ele que diz se
          isso é uma tarde ou uma semana.

          O link do upstream abre o diff a partir do merge-base, que inclui o que já foi trazido.

          | dependência | fixada | mais nova |
          |---|---|---|
          ${DEPS}

          **Ao sincronizar**, registre em \`engines/UPSTREAM.json\` no MESMO commit que traz o
          código: \`sincronizado\` para um import novo, ou uma entrada em \`trazidos\` para um commit
          ou PR avulso. E rode \`cargo test -p js\` em \`engines/scramjet/packages/core/rewriter\`, o
          mesmo teste do \`motor.yml\`: é ele que pega o nosso enxerto quebrando contra código novo
          deles.

          <sub>Atualizado automaticamente por \`.github/workflows/upstream.yml\`.</sub>
          CORPO
          )
          # `sed` para tirar a indentação do heredoc: manter o texto alinhado no YAML é o que o faz
          # legível aqui, e 10 espaços à esquerda no markdown viram bloco de código no GitHub.
          corpo=$(printf '%s' "$corpo" | sed 's/^          //')

          existente=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITULO in:title" --json number,title --jq ".[] | select(.title == \"$TITULO\") | .number" | head -1)

          if [ -n "$existente" ]; then
            gh issue edit "$existente" --repo "$GITHUB_REPOSITORY" --body "$corpo"
            echo "issue #$existente atualizada"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body "$corpo"
          fi
