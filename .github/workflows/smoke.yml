name: Smoke

# Prova que o tarball publicado sobe e serve o que o cliente realmente pede. Este repo não tinha
# teste nenhum: um bump de dependência que renomeasse um bundle só aparecia em produção, como
# navegação vazando para o upstream porque o ScramjetEngine.js não conseguiu carregar o motor.
#
# Chamado como gate pelo publish.yml (workflow_call) — nunca publicar um pacote cujo `npm ci` não
# resolve ou cujas rotas de asset sumiram — e roda sozinho em PR.
#
# O `schedule` semanal SAIU, e a história dele vale a nota. Ele nasceu porque as 4 dependências
# vinham de `releases/download/latest/...`, e a tag `latest` é MUTÁVEL — os bytes já foram
# republicados sob o mesmo nome uma vez, quebrando o `integrity` do lockfile (commit 06d49be). Um
# cron que reinstalasse toda semana era o jeito de descobrir isso aqui em vez de no servidor.
#
# A razão morreu em duas etapas. Primeiro as URLs passaram a apontar para tags que não se movem, e o
# cron ficou "por um motivo menor e ainda real: uma release pode ser apagada à mão". Depois o motor
# saiu do npm: **`backend/package.json` não referencia release nenhuma**, então não há asset que
# possa sumir debaixo dele. Sobrava vigiar a tag `v4` do toolkit e o npm público — e para isso o
# próximo push serve, porque nada aqui muda sem push.
#
# O horário semanal não se perdeu: foi para o `upstream.yml`, onde a pergunta ("o upstream mexeu?")
# de fato acontece sem ninguém tocar neste repositório.

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O único teste que olha para o que o servidor REALMENTE recebe.
  #
  # Todo o resto deste arquivo mede a árvore de trabalho do runner. O servidor não recebe a árvore:
  # recebe um tarball montado pelo `vssh-app-publish`, que faz `git add -A`, um commit efêmero e um
  # `git archive` — e o `git archive` respeita `export-ignore`. Entre uma coisa e outra cabem dois
  # acidentes que nada aqui pegava:
  #
  #   - um padrão de `.gitattributes` sem barra inicial casa em qualquer nível, então `vendor/`
  #     tiraria `backend/vendor/` do pacote. O app sobe, responde 200 no healthcheck, e dá 503 na
  #     máquina do usuário;
  #   - um arquivo untracked E não-ignorado (foi o caso do `logdehoje`, 3 MB) entra no tarball pelo
  #     `git add -A`, sem ninguém pedir.
  #
  # Os dois falham em silêncio. Este job os transforma em build vermelho.
  tarball:
    name: O pacote leva o que deve, e só
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Montar o tarball do mesmo jeito que o publish monta
        run: |
          git config user.name  vssh
          git config user.email vssh@localhost
          git add -A
          git commit -q --no-verify -m "snapshot do smoke" || true
          git archive --format=tar HEAD | gzip -n > /tmp/app.tar.gz
          tar -tzf /tmp/app.tar.gz | sort > /tmp/conteudo.txt
          echo "--- conteúdo ($(wc -l < /tmp/conteudo.txt) entradas, $(stat -c%s /tmp/app.tar.gz) bytes) ---"
          cat /tmp/conteudo.txt

      # O motor construído JÁ viaja no pacote, e por isso os sete arquivos dele estão nesta lista.
      # É o único lugar que pega o acidente do `.gitattributes` sem âncora — medido: com
      # `vendor/ export-ignore` em vez de `/vendor/`, o `backend/vendor/` sai do tarball com zero
      # entradas, e o app instala sem motor sem nada ficar vermelho.
      - name: O que precisa estar, está
        run: |
          erro=0
          # Os sete arquivos que `backend/server.js` serve. A mesma lista vive em
          # `scripts/montar-motor.sh`, que recusa MONTAR sem eles; aqui se confere o outro lado —
          # que eles chegaram ao PACOTE. São perguntas diferentes: montar certo e empacotar certo
          # falham por motivos diferentes, e o segundo é o que o servidor do usuário sente.
          for arq in scramjet/dist/scramjet.js scramjet/dist/scramjet.wasm \
                     controller/dist/controller.api.js controller/dist/controller.inject.js \
                     controller/dist/controller.sw.js utils/dist/scramjet-utils.js \
                     libcurl-transport/dist/index.js; do
            grep -qx "backend/vendor/$arq" /tmp/conteudo.txt || { echo "FALTA no tarball: backend/vendor/$arq"; erro=1; }
          done
          # E o BUILD.json de cada um: é o que o boot lê para dizer qual motor está rodando.
          for dir in scramjet controller utils libcurl-transport; do
            grep -qx "backend/vendor/$dir/BUILD.json" /tmp/conteudo.txt || { echo "FALTA no tarball: backend/vendor/$dir/BUILD.json"; erro=1; }
          done
          # O manifesto tem que cair na RAIZ do tarball: é onde o instalador o procura.
          # LICENSE e NOTICE viajam de propósito: o motor é AGPL, e a §13 dá a quem usa o serviço
          # o direito de saber o que está rodando e onde está o fonte. Um `export-ignore` distraído
          # os tiraria do pacote sem nenhum outro sintoma — daí estarem aqui e não num comentário.
          for exigido in vssh-app.json LICENSE NOTICE backend/server.js backend/package.json backend/package-lock.json; do
            grep -qx "$exigido" /tmp/conteudo.txt || { echo "FALTA no tarball: $exigido"; erro=1; }
          done
          # O entrypoint declarado no manifesto, seja ele qual for.
          ENTRY=$(jq -r .backend.entrypoint vssh-app.json)
          grep -qx "$ENTRY" /tmp/conteudo.txt || { echo "FALTA o entrypoint declarado: $ENTRY"; erro=1; }
          exit $erro

      - name: O que não pode estar, não está
        run: |
          erro=0
          # Bancada e metadados de empacotamento ficam versionados e fora do pacote — é a razão de
          # o `.gitattributes` existir. Se um `export-ignore` for removido ou perder a âncora, é
          # aqui que aparece.
          # (`.github/` NÃO está nesta lista de propósito: ele viaja no tarball hoje, e tirá-lo é
          # uma decisão separada desta. Um teste novo não deve mudar o que se empacota.)
          while read -r proibido; do
            if grep -q "^${proibido}" /tmp/conteudo.txt; then
              echo "NÃO DEVIA estar no tarball: $proibido"; erro=1
            fi
          done <<'PADROES'
          bench/
          .gitattributes
          engines/
          scripts/
          PADROES
          # Nada de node_modules: quem instala é o installCommand, no servidor.
          if grep -q "node_modules/" /tmp/conteudo.txt; then echo "NÃO DEVIA: node_modules no tarball"; erro=1; fi
          exit $erro

      - name: E cabe no orçamento
        run: |
          # Faixa, e não valor exato: um número exato viraria manutenção a cada commit. O que se
          # quer pegar é ordem de grandeza — pacote vazio (algo foi excluído demais) ou pacote
          # inchado (fonte ou dump vazou para dentro).
          #
          # Com o motor dentro são ~3,74 MB comprimidos (medido: 3.919.979 bytes em 60 entradas).
          #
          # ⚠ O PISO subiu de 20 KB para 2 MB, e é a metade que importa agora. Sem o motor o pacote
          # volta a ter ~55 KB — e 55 KB passava folgado no piso antigo. Ou seja: depois do cutover,
          # um piso de 20 KB deixaria passar exatamente o acidente que este job existe para pegar,
          # o app instalando sem motor. O piso tem que ficar ACIMA do tamanho do pacote sem motor,
          # não acima de zero.
          BYTES=$(stat -c%s /tmp/app.tar.gz)
          MIN=2097152    # 2 MB — abaixo disto o motor não está no pacote
          MAX=8388608    # 8 MB — ~2x o tamanho atual, folga para o motor crescer
          echo "tarball: ${BYTES} bytes (faixa aceita: ${MIN}..${MAX})"
          [ "$BYTES" -ge "$MIN" ] || { echo "pequeno demais — algo essencial saiu do pacote"; exit 1; }
          [ "$BYTES" -le "$MAX" ] || { echo "grande demais — algo vazou para dentro do pacote"; exit 1; }

  smoke:
    name: Sobe e serve o contrato
    runs-on: ubuntu-latest
    env:
      # Socket unix, e não porta: desde a v4 do toolkit o `escutar()` só binda socket. Este smoke
      # exportava VSSH_APP_PORT, então subia um backend que morre no boot com
      # VSSH_APP_SERVIDOR_ANTIGO — o smoke media o transporte que o app não fala mais.
      SOCK: '/tmp/scramjet-smoke.sock'
      TOKEN: 'smoke-token-nao-secreto'
    steps:
      - uses: actions/checkout@v5

      # Node 22: é o que o caminho do portal usa no servidor (`sudo` reescreve o PATH via
      # secure_path e resolve /usr/bin/node, não um nvm pessoal do usuário). Testar noutra major
      # aqui provaria algo que produção não executa.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Manifesto: o vssh-app-publish valida contra o JSON Schema, mas nenhuma das duas pontas
      # confere se o entrypoint EXISTE. Custa uma linha e roda em PR, antes do merge.
      - name: Manifesto é JSON válido e o entrypoint existe
        run: |
          jq -e . vssh-app.json > /dev/null
          test -f "$(jq -r .backend.entrypoint vssh-app.json)"

      # Pelo comando REAL do manifesto, não um `npm ci` escrito à mão: assim a própria string do
      # installCommand entra no teste. Numa checkout limpa não há stamp de lockfile, então cai
      # no `npm ci --omit=dev` — e é aqui que EINTEGRITY, lockfile dessincronizado ou release
      # apagado estouram.
      - name: Instalar pelo installCommand do manifesto
        run: bash -c "$(jq -r '.backend.installCommand' vssh-app.json)"

      # O outro lado do installCommand: ele PULA a instalação quando nada mudou, e é essa metade
      # que já falhou calada em produção. A versão anterior era `test -d node_modules` — "a pasta
      # existe, então está instalado" — e uma pasta existe para sempre. Resultado: SEIS bumps de
      # dependência seguidos (alpha.5 até alpha.10, com controller e utils junto) ficaram só no
      # lockfile enquanto o servidor continuava servindo o alpha.4, incluindo a correção de
      # isolamento entre origens proxiadas do alpha.5. Foi confirmado batendo os números de linha
      # do stack trace de um log de produção contra os sourcemaps de cada versão.
      #
      # Um bump que não chega ao usuário é pior que bump nenhum: o repositório diz uma coisa, a
      # máquina serve outra, e nada no caminho denuncia a diferença. O step acima nunca pegaria
      # isso — numa checkout limpa QUALQUER gate instala.
      #
      # Aqui trocamos só o `npm ci` por um marcador. O que falta provar não é a instalação (o step
      # acima já provou), é a DECISÃO de instalar — que é puramente local e não precisa de rede.
      - name: O installCommand reinstala quando o lockfile muda
        run: |
          CMD=$(jq -r '.backend.installCommand' vssh-app.json)
          FAKE=$(printf '%s' "$CMD" | sed 's|npm ci --omit=dev|{ echo MARCA-INSTALOU; mkdir -p node_modules; }|')
          test "$FAKE" != "$CMD" || { echo "FALHA: o sed não casou — o installCommand mudou de forma e este teste virou decorativo"; exit 1; }

          # 1. Lock intacto: não pode reinstalar (é o ganho que o gate existe para dar).
          case "$(bash -c "$FAKE")" in
            *MARCA-INSTALOU*) echo "FALHA: reinstalou sem o lockfile mudar"; exit 1 ;;
          esac
          echo "ok    lockfile intacto -> pulou"

          # 2. Lock alterado: TEM que reinstalar. É exatamente o caso que regrediu.
          cp backend/package-lock.json /tmp/lock.orig
          printf '\n' >> backend/package-lock.json
          case "$(bash -c "$FAKE")" in
            *MARCA-INSTALOU*) echo "ok    lockfile mudou -> reinstalou" ;;
            *) echo "FALHA: o lockfile mudou e o installCommand NÃO reinstalou — é o defeito que prendeu produção no alpha.4"; exit 1 ;;
          esac
          cp /tmp/lock.orig backend/package-lock.json

          # 3. VSSH_APP_REBUILD=1 continua forçando — contrato antigo, preservado de propósito.
          #    (Também deixa o stamp de volta em sincronia com o lockfile restaurado acima.)
          case "$(VSSH_APP_REBUILD=1 bash -c "$FAKE")" in
            *MARCA-INSTALOU*) echo "ok    VSSH_APP_REBUILD=1 -> reinstalou" ;;
            *) echo "FALHA: VSSH_APP_REBUILD=1 deixou de forçar a reinstalação"; exit 1 ;;
          esac

      # O trio scramjet/controller/utils é construído JUNTO, e as versões que cada um espera dos
      # outros são assadas no build (`SCRAMJET_EXPECTED_VERSION`). O `Controller` confere a do core
      # NO CONSTRUTOR e LANÇA — e o `new Controller(...)` do ScramjetEngine.js não está sob nenhum
      # try/catch que degrade. Ou seja: trio desalinhado não é "sem cache", é motor nenhum.
      #
      # O motor é construído de `engines/` e VERSIONADO em `backend/vendor/`. Duas coisas versionadas
      # que precisam andar juntas podem se separar, e a forma de separá-las é banal: mexer no fonte e
      # esquecer de remontar. O sintoma seria produção rodando um motor de outra árvore — a mesma
      # divergência invisível que fez o alpha.4 durar seis releases, só que por outro caminho.
      #
      # A conferência é por HASH DE ÁRVORE e não por comparação de bytes, e isso é escolha: refazer o
      # build aqui para diffar o resultado exigiria que ele fosse reprodutível byte a byte, o que
      # nenhum dos dois é (sourcemaps carregam caminhos, o CA bundle do libcurl flutua de propósito).
      # Um job assim ficaria vermelho por ruído, e vermelho por ruído é ignorado. `fonte` responde a
      # pergunta certa — "este artefato saiu DESTA árvore?" — e responde em milissegundos.
      #
      # Roda no smoke, que é o gate do publish: com o vendor atrasado, o push não publica.
      - name: O motor commitado corresponde às fontes de engines/
        run: |
          fail=0
          for dir in scramjet controller utils libcurl-transport; do
            fork=$(jq -r .fork "backend/vendor/$dir/BUILD.json")
            gravado=$(jq -r .fonte "backend/vendor/$dir/BUILD.json")
            atual=$(git rev-parse "HEAD:$fork")
            if [ "$gravado" = "$atual" ]; then
              echo "ok    $dir  $fork  ${atual:0:7}"
            else
              echo "FALHA $dir: BUILD.json diz ${gravado:0:7}, mas $fork está em ${atual:0:7}"
              echo "      O fonte mudou e o motor não foi remontado. Rode, de dentro do fork:"
              echo "        scripts/montar-motor.sh <scramjet|transport>"
              echo "      e commite backend/vendor/."
              fail=1
            fi
          done
          exit $fail

      # ⚠ A ORIGEM do desalinho mudou, e por isso a checagem ganhou uma primeira metade.
      #
      # Antes, o desalinho era fácil de produzir sem perceber porque os tarballs moravam na tag
      # mutável `latest` e o nome do arquivo carregava a versão: subir só o core deixava as URLs de
      # controller e utils IDÊNTICAS, o npm do consumidor reusava o tarball antigo pelo integrity do
      # lockfile, e o CI do fork já havia republicado aqueles dois esperando a versão nova.
      # Aconteceu: controller 0.0.16 e utils 0.0.4 ficaram esperando alpha.4 depois do bump para
      # alpha.5.
      #
      # Esse caminho morreu duas vezes: a `latest` foi congelada, e agora os três saem do MESMO
      # build da MESMA árvore. Daí a checagem nova, que é a decisiva: cada `BUILD.json` carrega o
      # hash da árvore do fork que o produziu, e três pacotes de `engines/scramjet` com `fonte`
      # diferente significam motor montado pela metade. É a mesma conferência que o boot do backend
      # faz (`conferirMotor`), aqui para reprovar antes de publicar.
      #
      # A checagem antiga FICA, e não por nostalgia: ela olha o conteúdo do bundle, não o metadado
      # ao lado dele. Um `montar-motor.sh` que copiasse o `dist` errado com o `BUILD.json` certo
      # passaria na primeira e cairia na segunda. Um bundle antigo NÃO PODE conter uma string de
      # versão que ainda não existia quando ele foi construído.
      - name: O trio scramjet está alinhado
        run: |
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            import { join } from "node:path";
            const NM = "backend/vendor";
            const ver = (p) => JSON.parse(readFileSync(join(NM, p, "package.json"), "utf8")).version;

            const fonteDe = (p) => JSON.parse(readFileSync(join(NM, p, "BUILD.json"), "utf8")).fonte;
            const fontes = ["scramjet", "controller", "utils"].map((p) => [p, fonteDe(p)]);
            console.log("fontes: " + fontes.map(([p, f]) => `${p}=${String(f).slice(0, 7)}`).join(" "));
            const distintas = new Set(fontes.map(([, f]) => f));
            if (distintas.size !== 1) {
              console.error(`FALHA: os três pacotes de engines/scramjet vieram de ${distintas.size} árvores diferentes.`);
              console.error("Motor montado pela metade: rode scripts/montar-motor.sh scramjet e commite backend/vendor/.");
              process.exit(1);
            }
            console.log("ok   os três saíram da mesma árvore");

            const core = ver("scramjet"), ctrl = ver("controller"), utils = ver("utils");
            console.log(`versões: core=${core} controller=${ctrl} utils=${utils}`);
            const bundles = (p) => {
              const d = join(NM, p, "dist");
              return readdirSync(d).filter((f) => f.endsWith(".js"))
                .map((f) => readFileSync(join(d, f), "utf8")).join("\n");
            };
            let bad = 0;
            const exige = (quem, texto, versao, dequem) => {
              const ok = texto.includes(JSON.stringify(versao)) || texto.includes(versao);
              console.log(`${ok ? "ok  " : "FALHA"} ${quem} traz a versão de ${dequem} (${versao})`);
              if (!ok) bad = 1;
            };
            const bc = bundles("controller"), bu = bundles("utils");
            exige("controller", bc, core,  "core");
            exige("utils",      bu, core,  "core");
            exige("utils",      bu, ctrl,  "controller");
            if (bad) console.error("\nTrio desalinhado: o Controller vai LANÇAR no construtor e o motor não sobe. Reconstrua os três juntos (scripts/montar-motor.sh scramjet) e commite backend/vendor/.");
            process.exit(bad);
          '

      # A política de saída (`backend/rede.js`): força IPv4, recusa destino IPv6 literal, e não
      # regride rede privada/loopback — que é o caso de uso principal deste motor. Sem rede: o
      # `dns.lookup` é injetado.
      #
      # Roda ANTES de subir o servidor de propósito. Se a política estiver errada, o servidor sobe
      # do mesmo jeito e todo o resto do smoke passa — o defeito só apareceria no servidor de alguém
      # tentando abrir um site.
      - name: A política de rede está certa
        run: cd backend && npm test

      # Da raiz do pacote, como o vssh-app-run faz (`cd "${APP_DIR}"` e depois
      # `exec node backend/server.js`) — não de dentro de backend/.
      - name: Subir o backend
        run: |
          VSSH_APP_SOCKET="$SOCK" VSSH_APP_TOKEN="$TOKEN" \
            node "$(jq -r .backend.entrypoint vssh-app.json)" > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null --unix-socket "$SOCK" "http://app/" && exit 0
            sleep 0.5
          done
          echo "backend não atendeu no socket em 20s"; cat server.log; exit 1

      # 200 EXATO e sem header de token. O healthcheckPath é pollado direto na porta, sem passar
      # pelo proxy, então não carrega X-Vssh-App-Token; e desde o commit 7bd90e1 do vssh-sso um 5xx
      # não conta mais como "pronto" (provisioning/vssh-apps.ts). Gatear ou degradar esta rota faz o
      # portal nunca declarar o app pronto.
      - name: Healthcheck
        run: |
          code=$(curl -sS -o body.txt -w '%{http_code}' --unix-socket "$SOCK" "http://app/")
          [ "$code" = "200" ] || { echo "healthcheck devolveu $code"; exit 1; }
          grep -q 'scramjet-wisp ok' body.txt || { echo "corpo inesperado: $(cat body.txt)"; exit 1; }

      # O boot diz que versões estão em disco — e acusa quando elas não são as do lockfile.
      #
      # Isto fecha o outro lado do buraco que prendeu produção no alpha.4. O `installCommand` já foi
      # consertado (e tem teste acima), mas o que faltava era o jeito de PERCEBER: nada no boot dizia
      # qual versão estava rodando, então a divergência só apareceu batendo números de linha de um
      # stack trace do console de um usuário contra os sourcemaps de cada release.
      #
      # Como no teste do installCommand, o que importa são as duas direções. Um aviso que aparece
      # sempre é ignorado sempre; um que nunca aparece não conserta nada.
      - name: O boot lista as versões, e acusa divergência
        run: |
          # 1. Árvore alinhada (é o estado depois do installCommand lá em cima): cada dependência
          #    declarada tem que estar nomeada no log, com a versão do lockfile ao lado.
          fail=0
          for pkg in $(jq -r '.dependencies | keys[]' backend/package.json); do
            ver=$(jq -r --arg p "node_modules/$pkg" '.packages[$p].version' backend/package-lock.json)
            if grep -qF "$pkg $ver" server.log; then
              echo "ok    $pkg $ver no log de boot"
            else
              echo "FALHA: o boot não nomeou $pkg $ver"; fail=1
            fi
          done
          grep -q 'ATENÇÃO' server.log && { echo "FALHA: avisou divergência numa árvore alinhada"; fail=1; }

          # 1b. O MOTOR também tem que estar nomeado. Ele saiu do `package.json` — é construído de
          #     `engines/` e versionado em `backend/vendor/` —, então o laço acima não o alcança, e
          #     sem esta conferência a metade mais importante do boot poderia emudecer sem ninguém ver.
          for dir in scramjet controller utils libcurl-transport; do
            v=$(jq -r .versao "backend/vendor/$dir/BUILD.json")
            if grep -qF "motor $dir $v" server.log; then
              echo "ok    motor $dir $v no log de boot"
            else
              echo "FALHA: o boot não nomeou o motor $dir $v"; fail=1
            fi
          done

          # Sobe o backend com a árvore mexida e devolve tudo ao lugar. `$1` é o rótulo do log.
          boot_com_arvore_torta() {
            VSSH_APP_SOCKET="/tmp/scramjet-$1.sock" \
              node "$(jq -r .backend.entrypoint vssh-app.json)" > "$1.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do
              curl -sS -o /dev/null --unix-socket "/tmp/scramjet-$1.sock" "http://app/" 2>/dev/null && break
              sleep 0.4
            done
            vivo=$(kill -0 $pid 2>/dev/null && echo sim || echo nao)
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --unix-socket "/tmp/scramjet-$1.sock" "http://app/" || echo 000)
            kill $pid 2>/dev/null || true; sleep 1
            echo "--- log do boot $1 ---"; cat "$1.log"
            # Divergência não impede navegar: o motor tem que continuar de pé e o healthcheck 200. Um
            # aviso que derruba o app seria pior que a cegueira que ele conserta.
            [ "$vivo" = "sim" ]   || { echo "FALHA ($1): o processo morreu por causa de uma divergência"; fail=1; }
            [ "$codigo" = "200" ] || { echo "FALHA ($1): healthcheck virou $codigo com árvore divergente"; fail=1; }
          }

          # 2. Dependência npm divergente: forjar uma versão em disco e exigir que o boot grite. Mexe
          #    só no package.json do pacote instalado — não precisa de rede, e é exatamente a forma do
          #    incidente (disco atrasado em relação ao lockfile).
          #
          #    O alvo é o `wisp-js` porque o scramjet SAIU do npm; das duas dependências que restaram
          #    é a que o motor não pode perder. O mecanismo exercitado é o mesmo de antes.
          ALVO=backend/node_modules/@mercuryworkshop/wisp-js
          cp "$ALVO/package.json" /tmp/wisp-pkg.orig
          node -e '
            const fs = require("fs"), p = process.argv[1] + "/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = "0.0.0-forjada";
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
          ' "$ALVO"
          boot_com_arvore_torta divergente
          cp /tmp/wisp-pkg.orig "$ALVO/package.json"
          grep -q 'ATENÇÃO' divergente.log       || { echo "FALHA: não avisou a divergência"; fail=1; }
          grep -q '0.0.0-forjada' divergente.log || { echo "FALHA: o aviso não diz a versão que está em disco"; fail=1; }
          grep -qF '@mercuryworkshop/wisp-js' divergente.log || { echo "FALHA: o aviso não nomeia o pacote"; fail=1; }

          # 3. Motor montado pela metade. É a divergência que NASCEU com o monorepo: os três pacotes
          #    do scramjet saem da mesma árvore, e `fonte` diferente entre eles prova que alguém
          #    montou um build por cima de outro. O passo "O trio scramjet está alinhado" reprova
          #    isso antes de publicar; aqui se mede a outra ponta — que o SERVIDOR JÁ INSTALADO
          #    também acusa, que é onde a informação serve a quem está diante do incidente.
          cp backend/vendor/controller/BUILD.json /tmp/controller-build.orig
          node -e '
            const fs = require("fs"), p = process.argv[1];
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.fonte = "0000000forjada0000000000000000000000000";
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
          ' backend/vendor/controller/BUILD.json
          boot_com_arvore_torta motor-torto
          cp /tmp/controller-build.orig backend/vendor/controller/BUILD.json
          grep -q 'montado de árvores diferentes' motor-torto.log || { echo "FALHA: não acusou motor montado pela metade"; fail=1; }
          grep -q 'engines/scramjet' motor-torto.log || { echo "FALHA: o aviso não nomeia o fork"; fail=1; }

          exit $fail

      # A verificação de maior valor do arquivo. Cada caminho abaixo é carregado nominalmente pelo
      # consumidor no vssh-sso — se um upgrade de dependência renomear qualquer um, isto fica
      # vermelho aqui em vez de quebrar a navegação de todo mundo:
      #   scram/scramjet.js            ScramjetEngine.js:153
      #   scram/scramjet.wasm          ScramjetEngine.js:214 (wasmPath)
      #   controller/controller.api.js ScramjetEngine.js:154
      #   controller/controller.inject.js  ScramjetEngine.js:213 (injectPath)
      #   controller/controller.sw.js  scram-sw.js:23 (importScripts)
      #   libcurl/index.js             ScramjetEngine.js:155
      #   utils/scramjet-utils.js      ScramjetEngine.js:163
      #
      # Tamanho > 0 junto do status: um 200 vazio passaria num teste que só olhasse o código.
      # `no-store` é load-bearing em controller.sw.js — importScripts() não revalida imports por
      # padrão, então com cache um SW recém-instalado seguiria executando o bundle velho.
      - name: Os 7 assets que o cliente carrega
        run: |
          fail=0
          for p in scram/scramjet.js scram/scramjet.wasm \
                   controller/controller.api.js controller/controller.inject.js \
                   controller/controller.sw.js libcurl/index.js utils/scramjet-utils.js; do
            read -r code size < <(curl -sS -o /dev/null -D h.txt \
              -w '%{http_code} %{size_download}\n' --unix-socket "$SOCK" "http://app/$p")
            cc=$(grep -i '^cache-control:' h.txt | tr -d '\r' | head -1)
            printf '%-34s %s %8s bytes  %s\n' "$p" "$code" "$size" "$cc"
            [ "$code" = "200" ]                || { echo "  ^ status != 200"; fail=1; }
            [ "${size:-0}" -gt 0 ]             || { echo "  ^ corpo vazio";   fail=1; }
            echo "$cc" | grep -qi 'no-store'   || { echo "  ^ sem no-store";  fail=1; }
          done
          exit $fail

      - name: WASM sai com o content-type certo
        run: |
          ct=$(curl -sS -o /dev/null -w '%{content_type}' --unix-socket "$SOCK" "http://app/scram/scramjet.wasm")
          case "$ct" in application/wasm*) ;; *) echo "content-type do wasm: $ct"; exit 1 ;; esac

      - name: 404 em asset inexistente
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --unix-socket "$SOCK" "http://app/scram/nao-existe.js")
          [ "$code" = "404" ] || { echo "esperava 404, veio $code"; exit 1; }

      # `--path-as-is` é obrigatório: sem ele o curl normaliza o `..` do lado cliente e o teste vira
      # no-op, passando mesmo que a guarda do servidor não existisse. A segunda forma, percent-
      # encoded, cobre o outro lado da guarda — o decodeURIComponent que roda antes do path.join.
      - name: Path traversal recusado
        run: |
          a=$(curl -sS --path-as-is -o /dev/null -w '%{http_code}' \
                --unix-socket "$SOCK" "http://app/scram/../../../../etc/passwd")
          b=$(curl -sS -o /dev/null -w '%{http_code}' \
                --unix-socket "$SOCK" "http://app/scram/%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fetc/passwd")
          echo "path-as-is=$a  percent-encoded=$b"
          [ "$a" = "400" ] && [ "$b" = "400" ] || { echo "traversal não foi recusado com 400"; exit 1; }

      # Prova duas coisas de uma vez: que o gate de token do upgrade funciona nas três negativas, e
      # que o wisp.routeRequest de fato sobe (o 101 só acontece se as wisp.options não explodiram no
      # import). Com node:http cru — nada de dependência nova só para o teste.
      - name: Gate de token no upgrade WebSocket
        run: |
          node --input-type=module -e '
            import http from "node:http";
            import crypto from "node:crypto";
            const probe = (path, extra) => new Promise((resolve) => {
              const req = http.request({
                socketPath: process.env.SOCK, path,
                headers: {
                  Connection: "Upgrade", Upgrade: "websocket", "Sec-WebSocket-Version": "13",
                  "Sec-WebSocket-Key": crypto.randomBytes(16).toString("base64"), ...extra,
                },
              });
              req.on("upgrade", (res, s) => { s.destroy(); resolve("upgrade:" + res.statusCode); });
              req.on("response", (res) => { res.resume(); resolve("response:" + res.statusCode); });
              req.on("error", () => resolve("error"));
              req.on("close", () => resolve("closed"));
              setTimeout(() => { req.destroy(); resolve("timeout"); }, 5000).unref();
              req.end();
            });
            const T = process.env.TOKEN;
            const r = {
              comToken:   await probe("/wisp/", { "x-vssh-app-token": T }),
              semToken:   await probe("/wisp/", {}),
              tokenErrado:await probe("/wisp/", { "x-vssh-app-token": "errado" }),
              pathErrado: await probe("/nope/", { "x-vssh-app-token": T }),
            };
            console.log(r);
            let bad = 0;
            if (!r.comToken.startsWith("upgrade:101")) {
              console.error("FALHA: /wisp/ com token deveria fazer upgrade 101"); bad = 1;
            }
            for (const k of ["semToken", "tokenErrado", "pathErrado"]) {
              if (r[k].startsWith("upgrade:")) {
                console.error(`FALHA: ${k} não deveria fazer upgrade (${r[k]})`); bad = 1;
              }
            }
            process.exit(bad);
          '

      - name: Encerrar a instância saudável
        run: kill "$(cat server.pid)" 2>/dev/null || true

      # Regressão do modo degradado. Antes, resolver os pacotes acontecia no topo do módulo: faltar
      # um matava o processo ANTES do listen(), o portal media HTTP 000 e o usuário recebia 502 sem
      # nenhuma pista de qual pacote faltava. Estes dois casos travam o comportamento novo:
      #   - opcional ausente  → o motor continua servindo, healthcheck 200, e só a rota dele dá 503
      #   - essencial ausente → o processo NÃO morre; a porta abre e / responde 503 nomeando o pacote
      # O 503 na rota importa tanto quanto o do healthcheck: sem ele a requisição cairia no catch-all
      # e receberia `200 scramjet-wisp ok`, texto puro no lugar de um bundle — que _loadScript()
      # trata como sucesso, deixando o cliente convencido de que carregou o motor.
      - name: Degradação nomeia o pacote em vez de matar o processo
        run: |
          # `backend/vendor` e não mais `node_modules`: o motor deixou de ser dependência npm. O
          # cenário que este teste monta ficou, se alguma coisa, MAIS realista — antes ele simulava
          # um `npm ci` incompleto, e agora simula o que de fato pode chegar ao servidor: um tarball
          # do app a que falta parte do motor.
          NM=backend/vendor
          check() {  # $1=dir em vendor/  $2=status em /  $3=rota  $4=status na rota  $5=pacote nomeado no 503
            mv "$NM/$1" "$NM/.bak"
            VSSH_APP_SOCKET="$SOCK" node "$(jq -r .backend.entrypoint vssh-app.json)" > d.log 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do curl -sS -o /dev/null --unix-socket "$SOCK" "http://app/" 2>/dev/null && break; sleep 0.4; done
            alive=$(kill -0 $pid 2>/dev/null && echo sim || echo nao)
            root=$(curl -sS -o root.txt -w '%{http_code}' --unix-socket "$SOCK" "http://app/")
            rota=$(curl -sS -o rota.txt -w '%{http_code}' --unix-socket "$SOCK" "http://app/$3")
            kill $pid 2>/dev/null || true; sleep 1
            mv "$NM/.bak" "$NM/$1"
            echo "sem $1 → vivo=$alive  /=$root (esperado $2)  /$3=$rota (esperado $4)"
            [ "$alive" = "sim" ] || { echo "  ^ o processo MORREU — é a regressão que este teste existe para pegar"; return 1; }
            [ "$root" = "$2" ]   || { echo "  ^ healthcheck inesperado: $(head -c 200 root.txt)"; return 1; }
            [ "$rota" = "$4" ]   || { echo "  ^ rota inesperada: $(head -c 200 rota.txt)"; return 1; }
            # O NOME DO PACOTE, e não o do diretório: é `@mercuryworkshop/scramjet-utils` que quem
            # opera reconhece, e conferir pelo diretório passaria por acaso (`utils` casa dentro de
            # `scramjet-utils`) mesmo que o 503 tivesse deixado de nomeá-lo.
            grep -qF "$5" rota.txt || [ "$4" = "200" ] || { echo "  ^ o 503 não nomeia o pacote ($5)"; return 1; }
          }
          rc=0
          check utils    200 utils/scramjet-utils.js 503 @mercuryworkshop/scramjet-utils || rc=1
          check scramjet 503 scram/scramjet.js       503 @mercuryworkshop/scramjet       || rc=1
          exit $rc

      - name: Log do backend
        if: always()
        run: cat server.log d.log 2>/dev/null || true

      - name: Encerrar
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
