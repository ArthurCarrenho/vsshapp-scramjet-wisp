name: CI

on:
  push:
    paths-ignore: &ci_ignore_paths
      - ".zed/**"
      - ".vscode/**"
      - "README.md"
      # Formatters
      - ".editorconfig"
      - "eslint.config.json"
      - "prettier.config.json"
  pull_request:
    paths-ignore: *ci_ignore_paths
  workflow_dispatch:

env:
  WASM_BINDGEN_VERSION: "0.2.105"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      scramjet_version_changed: ${{ steps.check-scramjet.outputs.version_changed }}
      scramjet_new_version: ${{ steps.check-scramjet.outputs.new_version }}
      scramjet_tag_arg: ${{ steps.check-scramjet.outputs.tag_arg }}
      controller_version_changed: ${{ steps.check-scramjet-controller.outputs.version_changed }}
      controller_new_version: ${{ steps.check-scramjet-controller.outputs.new_version }}
      controller_tag_arg: ${{ steps.check-scramjet-controller.outputs.tag_arg }}
      utils_version_changed: ${{ steps.check-scramjet-utils.outputs.version_changed }}
      utils_new_version: ${{ steps.check-scramjet-utils.outputs.new_version }}
      utils_tag_arg: ${{ steps.check-scramjet-utils.outputs.tag_arg }}
      bootstrap_version_changed: ${{ steps.check-bootstrap.outputs.version_changed }}
      bootstrap_new_version: ${{ steps.check-bootstrap.outputs.new_version }}
      bootstrap_tag_arg: ${{ steps.check-bootstrap.outputs.tag_arg }}
      create_proxy_app_version_changed: ${{ steps.check-create-proxy-app.outputs.version_changed }}
      create_proxy_app_new_version: ${{ steps.check-create-proxy-app.outputs.new_version }}
      create_proxy_app_tag_arg: ${{ steps.check-create-proxy-app.outputs.tag_arg }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Check the version (scramjet/core)
        id: check-scramjet
        run: |
          CURRENT_VERSION=$(jq -r .version packages/core/package.json)
          echo "Current version: $CURRENT_VERSION"
          LATEST_VERSION=$(npm view @mercuryworkshop/scramjet versions --json | jq -r '.[-1]' || echo "0.0.0")
          echo "Latest NPM version: $LATEST_VERSION"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ];
          then
            echo "Version changed"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            TAG_ARG=""
            if [[ "$CURRENT_VERSION" == *-* ]]; then PRE="${CURRENT_VERSION#*-}"; TAG_ARG="--tag ${PRE%%[.+]*}"; fi
            echo "tag_arg=$TAG_ARG" >> "$GITHUB_OUTPUT"
          else
            echo "Version not changed"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version (scramjet/controller)
        id: check-scramjet-controller
        run: |
          CURRENT_VERSION=$(jq -r .version packages/controller/package.json)
          echo "Current version: $CURRENT_VERSION"
          LATEST_VERSION=$(npm view @mercuryworkshop/scramjet-controller versions --json | jq -r '.[-1]' || echo "0.0.0")
          echo "Latest NPM version: $LATEST_VERSION"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ];
          then
            echo "Version changed"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            TAG_ARG=""
            if [[ "$CURRENT_VERSION" == *-* ]]; then PRE="${CURRENT_VERSION#*-}"; TAG_ARG="--tag ${PRE%%[.+]*}"; fi
            echo "tag_arg=$TAG_ARG" >> "$GITHUB_OUTPUT"
          else
            echo "Version not changed"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version (scramjet/utils)
        id: check-scramjet-utils
        run: |
          CURRENT_VERSION=$(jq -r .version packages/utils/package.json)
          echo "Current version: $CURRENT_VERSION"
          LATEST_VERSION=$(npm view @mercuryworkshop/scramjet-utils versions --json | jq -r '.[-1]' || echo "0.0.0")
          echo "Latest NPM version: $LATEST_VERSION"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ];
          then
            echo "Version changed"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            TAG_ARG=""
            if [[ "$CURRENT_VERSION" == *-* ]]; then PRE="${CURRENT_VERSION#*-}"; TAG_ARG="--tag ${PRE%%[.+]*}"; fi
            echo "tag_arg=$TAG_ARG" >> "$GITHUB_OUTPUT"
          else
            echo "Version not changed"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version (proxy-bootstrap)
        id: check-bootstrap
        run: |
          CURRENT_VERSION=$(jq -r .version packages/bootstrap/package.json)
          echo "Current version: $CURRENT_VERSION"
          LATEST_VERSION=$(npm view @mercuryworkshop/proxy-bootstrap versions --json | jq -r '.[-1]' || echo "0.0.0")
          echo "Latest NPM version: $LATEST_VERSION"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ];
          then
            echo "Version changed"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            TAG_ARG=""
            if [[ "$CURRENT_VERSION" == *-* ]]; then PRE="${CURRENT_VERSION#*-}"; TAG_ARG="--tag ${PRE%%[.+]*}"; fi
            echo "tag_arg=$TAG_ARG" >> "$GITHUB_OUTPUT"
          else
            echo "Version not changed"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version (create-proxy-app)
        id: check-create-proxy-app
        run: |
          CURRENT_VERSION=$(jq -r .version packages/create-proxy-app/package.json)
          echo "Current version: $CURRENT_VERSION"
          LATEST_VERSION=$(npm view create-proxy-app versions --json | jq -r '.[-1]' || echo "0.0.0")
          echo "Latest NPM version: $LATEST_VERSION"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ];
          then
            echo "Version changed"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            TAG_ARG=""
            if [[ "$CURRENT_VERSION" == *-* ]]; then PRE="${CURRENT_VERSION#*-}"; TAG_ARG="--tag ${PRE%%[.+]*}"; fi
            echo "tag_arg=$TAG_ARG" >> "$GITHUB_OUTPUT"
          else
            echo "Version not changed"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Scramjet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Setup Rewriter Toolchain
        uses: ./.github/actions/setup-rewriter-toolchain
        with:
          wasm-bindgen-version: ${{ env.WASM_BINDGEN_VERSION }}
          rewriter-path: packages/core/rewriter
          github-token: ${{ github.token }}

      - name: Pack Scramjet
        run: pnpm pack
        working-directory: packages/core

      - name: Pack Scramjet Controller
        run: pnpm pack
        working-directory: packages/controller

      - name: Pack Scramjet Utils
        run: pnpm pack
        working-directory: packages/utils

      - name: Pack Proxy Bootstrap
        run: pnpm pack
        working-directory: packages/bootstrap

      - name: Pack create-proxy-app
        run: pnpm pack
        working-directory: packages/create-proxy-app

      - name: Upload Artifact (scramjet/core)
        uses: actions/upload-artifact@v6
        with:
          name: scramjet
          path: packages/core/dist/*

      - name: Upload Artifact (scramjet/core) (packaged)
        uses: actions/upload-artifact@v6
        with:
          name: scramjet-package
          path: packages/core/mercuryworkshop-scramjet-*.tgz

      - name: Upload Artifact (scramjet/controller)
        uses: actions/upload-artifact@v6
        with:
          name: scramjet-controller
          path: packages/controller/dist/*

      - name: Upload Artifact (scramjet/controller) (packaged)
        uses: actions/upload-artifact@v6
        with:
          name: scramjet-controller-package
          path: packages/controller/mercuryworkshop-scramjet-controller-*.tgz

      - name: Upload Artifact (scramjet/utils)
        uses: actions/upload-artifact@v6
        with:
          name: scramjet-utils
          path: packages/utils/dist/*

      - name: Upload Artifact (scramjet/utils) (packaged)
        uses: actions/upload-artifact@v6
        with:
          name: scramjet-utils-package
          path: packages/utils/mercuryworkshop-scramjet-utils-*.tgz

      - name: Upload Artifact (proxy-bootstrap) (packaged)
        uses: actions/upload-artifact@v6
        with:
          name: proxy-bootstrap-package
          path: packages/bootstrap/mercuryworkshop-proxy-bootstrap-*.tgz

      - name: Upload Artifact (create-proxy-app) (packaged)
        uses: actions/upload-artifact@v6
        with:
          name: create-proxy-app-package
          path: packages/create-proxy-app/create-proxy-app-*.tgz

  package-validation:
    name: Validate Package Structure
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Get artifacts
        uses: actions/download-artifact@v7
        with:
          name: scramjet-package
          path: packages/core

      - name: Extract package
        run: tar xvf mercuryworkshop-scramjet-*.tgz package --strip-components=1
        working-directory: packages/core

      - name: Run package validation tests
        run: pnpm test:package

  # vssh fork: Runway (Playwright/Chromium) test job removed. Browser-integration tests took ~10min
  # per run and failed intermittently on things unrelated to our changes, blocking upload/publish.
  # Removed from the `needs` of `upload` and `publish` below. `rewritertests` (deterministic cargo)
  # stays on the blocking path.

  rewritertests:
    name: Run Rewriter Tests
    runs-on: ubuntu-latest
    needs: [build, package-validation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/core/rewriter -> target"
          cache-all-crates: true
          shared-key: "rewriter"

      - name: Run Tests
        run: cargo test
        working-directory: packages/core/rewriter/native

  upload:
    name: Upload release
    runs-on: ubuntu-latest
    needs: [version-check, build, package-validation, rewritertests]
    permissions: write-all
    if: github.ref == 'refs/heads/main'

    steps:
      # vssh fork: **este passo apagava a release `latest` a cada build**, e era o defeito mais caro
      # do pipeline inteiro. Era um `gh release delete latest --yes --cleanup-tag` (que por sua vez
      # substituíra a action `dev-drprasad/delete-tag-and-release@v1.1`, em Node 20 deprecado).
      #
      # O problema não é a ferramenta, é a ideia. Os consumidores instalam por URL de tarball
      # apontando para essa release. Apagar e recriar significa que:
      #
      #   - o `integrity` gravado no lockfile de quem consome deixa de bater quando o mesmo nome de
      #     arquivo volta com bytes diferentes — e o `npm ci` do servidor morre com EINTEGRITY;
      #   - qualquer push aqui destrói os tarballs que produção está usando naquele instante;
      #   - e, por tabela, subir um conserto pronto virava uma decisão de risco em vez de um push.
      #
      # Agora `latest` é ATUALIZADA (`allowUpdates` abaixo), nunca destruída, e cada build ganha uma
      # release própria com tag que não se move — que é de onde os consumidores devem instalar.
      - name: SHA curto para a tag do build
        id: sha
        run: echo "curto=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Get artifacts
        uses: actions/download-artifact@v7
        with:
          name: scramjet-package
          path: .

      - name: Get artifacts
        uses: actions/download-artifact@v7
        with:
          name: scramjet-controller-package
          path: .

      - name: Get artifacts (scramjet/utils)
        uses: actions/download-artifact@v7
        with:
          name: scramjet-utils-package
          path: .

      # vssh fork: **a release `latest` está CONGELADA de propósito, e por isso não há passo que a
      # escreva.** Ela continua existindo e continua servindo os tarballs que estão em produção
      # hoje; ela só não recebe mais nada.
      #
      # Congelar em vez de atualizar, porque atualizar seria trocar bytes debaixo de um nome de
      # arquivo que já está gravado no `package-lock.json` de quem consome. `alpha.13` do `latest`
      # tem que continuar sendo, para sempre, os mesmos bytes que produção instalou — senão o
      # `npm ci` do servidor morre com EINTEGRITY, que é exatamente o incidente que motivou o cron
      # semanal do smoke do app.
      #
      # (O que estava aqui era um `ncipollo/release-action` com `tag: latest`, precedido de um
      # `gh release delete latest --cleanup-tag`. Apagar e recriar tinha o mesmo efeito, só que
      # mais violento: destruía os tarballs em uso a cada push.)
      #
      # Apagar a `latest` é outra decisão, e vem depois — servidores rodando a versão antiga do app
      # ainda apontam para essas URLs, e toda reinstalação lá reinstala a partir delas.

      # vssh fork: a release IMUTÁVEL deste build, e é dela que o app deve instalar.
      #
      # As outras duas (`latest` e `v<versão>`) são reescritas: `latest` a cada push, e a com versão
      # sempre que a versão não mudou — que no fork é quase sempre, porque o `version-check` compara
      # com um npm que nunca alimentamos. Nenhuma das duas serve para gravar num lockfile.
      #
      # A tag carrega o run e o SHA: o run dá ordem legível, o SHA diz exatamente de que código
      # aquele tarball saiu. Nada nesta tag se move depois de criada.
      - name: Release imutável deste build
        uses: ncipollo/release-action@v1
        with:
          name: "engine ${{ steps.sha.outputs.curto }}"
          tag: "engine-${{ github.run_number }}-${{ steps.sha.outputs.curto }}"
          commit: ${{ github.sha }}
          body: "${{ github.event.head_commit.url }} ${{ github.event.head_commit.message }}"
          artifacts: "mercuryworkshop-scramjet-*.tgz"
          prerelease: true
          makeLatest: false

      # vssh fork: allowUpdates nos releases com tag. O version-check compara a versão do pacote com
      # a do NPM PÚBLICO — e o fork nunca publica lá (ver o job de publish removido acima). Então,
      # para todo pacote em que divergimos do upstream, *_version_changed é `true` em TODO push, pra
      # sempre, e estes passos tentam recriar a mesma tag a cada build. Sem allowUpdates o segundo
      # push falha com "release já existe" — e o mais traiçoeiro é que ele falha DEPOIS do "Release
      # unstable build" acima, que é o único que os consumidores usam: o artefato certo já estava
      # publicado, mas o build ficava vermelho.
      - name: Release tagged version to GitHub (scramjet/core)
        if: needs.version-check.outputs.scramjet_version_changed == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: "${{ needs.version-check.outputs.scramjet_new_version }}"
          tag: "v${{ needs.version-check.outputs.scramjet_new_version }}"
          commit: main
          body: "${{ github.event.head_commit.url }} ${{ github.event.head_commit.message }}"
          artifacts: "mercuryworkshop-scramjet-*.tgz"
          allowUpdates: true

      - name: Release tagged version to GitHub (scramjet/controller)
        if: needs.version-check.outputs.controller_version_changed == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: "${{ needs.version-check.outputs.controller_new_version }}-controller"
          tag: "v${{ needs.version-check.outputs.controller_new_version }}-controller"
          commit: main
          body: "${{ github.event.head_commit.url }} ${{ github.event.head_commit.message }}"
          artifacts: "mercuryworkshop-scramjet-controller-*.tgz"
          makeLatest: false
          allowUpdates: true

  # vssh fork: NPM publish job removed. It published @mercuryworkshop/* to the public npm
  # registry — the fork has no rights to those package names, and must never take them. Every
  # bumped version failed here AFTER the release upload had already succeeded, turning a green
  # build into a red one for no reason. Consumers of this fork install straight from the GitHub
  # release tarballs (see the `upload` job above), never from npm.

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions: write-all
    needs: [build, package-validation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Get artifacts (scramjet/core)
        uses: actions/download-artifact@v7
        with:
          name: scramjet
          path: packages/core/dist

      - name: Get artifacts (scramjet/controller)
        uses: actions/download-artifact@v7
        with:
          name: scramjet-controller
          path: packages/controller/dist

      - name: Get artifacts (scramjet/utils)
        uses: actions/download-artifact@v7
        with:
          name: scramjet-utils
          path: packages/utils/dist

      - name: Build Frontend
        run: VITE_WISP_URL="wss://anura.pro/" pnpm build
        working-directory: packages/demo

      - name: Upload Artifact (frontend)
        uses: actions/upload-artifact@v6
        with:
          name: frontend
          path: ./packages/demo/dist

  # vssh fork: GitHub Pages deploy removed — we don't host the demo site, and it failed the run
  # because Pages isn't enabled on the fork. The `frontend` job above still builds the demo (it
  # passes); only the Pages upload/deploy is dropped.
