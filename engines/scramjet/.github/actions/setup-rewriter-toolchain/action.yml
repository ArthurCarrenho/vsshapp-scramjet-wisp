name: "Setup Rust Rewriter Toolchain"
description: "Setup Rust toolchain with wasm-bindgen, binaryen, and wasm-snip for building the scramjet rewriter"

inputs:
  wasm-bindgen-version:
    description: "Version of wasm-bindgen-cli to install"
    required: false
    default: "0.2.105"
  rewriter-path:
    description: "Path to the rewriter directory for Rust cache"
    required: true
  github-token:
    description: "GitHub token for Binaryen setup"
    required: true

runs:
  using: "composite"
  steps:
    - name: Cache Rust compilation
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "${{ inputs.rewriter-path }} -> target"
        cache-all-crates: true
        shared-key: "rewriter"

    - name: Cache cargo bin tools
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin
        key: cargo-bin-${{ runner.os }}-wbg${{ inputs.wasm-bindgen-version }}-wasm-snip
        restore-keys: |
          cargo-bin-${{ runner.os }}-

    - name: Install wasm-bindgen-cli
      shell: bash
      run: |
        if ! command -v wasm-bindgen &> /dev/null || ! [[ "$(wasm-bindgen -V)" =~ ^"wasm-bindgen ${{ inputs.wasm-bindgen-version }}" ]]; then
          cargo install wasm-bindgen-cli --version ${{ inputs.wasm-bindgen-version }}
        fi

    # vssh fork: esta é a única action que sobrou em Node 16 (as demais foram para majors que rodam
    # em Node 24). Não há versão mais nova publicada — v1.0.0 é a última tag do repositório — então
    # o aviso de deprecação daqui não sai por bump.
    #
    # Substituí-la é fácil (baixar o tarball do binaryen e pôr no PATH), mas exige FIXAR uma versão,
    # e hoje a action resolve a mais recente. Fixar troca o wasm-opt que otimiza o WASM do rewriter,
    # ou seja, muda o binário publicado — isso é decisão própria, com build para conferir, e não
    # carona numa limpeza de avisos.
    - name: Setup Binaryen
      uses: Aandreba/setup-binaryen@v1.0.0
      with:
        token: ${{ inputs.github-token }}

    - name: Setup wasm-snip
      shell: bash
      run: |
        if ! command -v wasm-snip &> /dev/null; then
          cargo install --git https://github.com/r58playz/wasm-snip
        fi
