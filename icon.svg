<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Motor Scramjet">
  <title>Motor Scramjet</title>
  <!--
    O dardo com o rastro atrás: o navegador do ambiente indo à web pelo servidor. O ladrilho é o da
    família, o do Cavalete: #15171c sangrado até a borda, sem raio próprio, porque quem arredonda os
    cantos é o shell, e a luz radial do alto à esquerda.

    O dardo tem duas faces. A de cima, virada para a luz, é clara, e a de baixo é escura. O rastro
    some para trás.

    Os ids levam o prefixo `scramjet-`. O shell carrega o ícone por <img>, e cada documento tem os
    ids dele; quem puser dois ícones da família inline na mesma página não vê o gradiente de um
    pintar o outro.
  -->
  <defs>
    <radialGradient id="scramjet-luz" cx="0.3" cy="0.2" r="0.85"><stop offset="0" stop-color="#2a2e38"/><stop offset="1" stop-color="#15171c" stop-opacity="0"/></radialGradient>
    <linearGradient id="scramjet-cima" gradientUnits="userSpaceOnUse" x1="22" y1="16" x2="50" y2="32"><stop offset="0" stop-color="#a6d4ff"/><stop offset="1" stop-color="#4aa3ff"/></linearGradient>
    <linearGradient id="scramjet-baixo" gradientUnits="userSpaceOnUse" x1="28" y1="32" x2="40" y2="48"><stop offset="0" stop-color="#3a91ee"/><stop offset="1" stop-color="#1e66c2"/></linearGradient>
    <linearGradient id="scramjet-rastro" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ccbff" stop-opacity=".25"/><stop offset="1" stop-color="#9ccbff"/></linearGradient>
  </defs>
  <rect width="64" height="64" fill="#15171c"/>
  <rect width="64" height="64" fill="url(#scramjet-luz)"/>
  <path d="M8 32h13M10 24h7M10 40h7" fill="none" stroke="url(#scramjet-rastro)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M53 32 21 17l6.5 15z" fill="url(#scramjet-cima)"/>
  <path d="M53 32H27.5L21 47z" fill="url(#scramjet-baixo)"/>
  <path d="M23.5 19.2 49 31.2" stroke="#fff" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
</svg>
